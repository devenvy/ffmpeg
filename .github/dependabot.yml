# Dependabot handles GitHub Actions version updates (SHAs/tags in .github/workflows/).
# The build DEPENDENCIES (codec/util libraries) are handled separately by Renovate,
# which is scoped to deps.json only — see renovate.json + .github/workflows/renovate.yml.
# Keeping this config in-repo (rather than the repo-settings UI) makes the policy visible
# and reviewable.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"                     # scans all workflows under .github/workflows/
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:                  # one grouped PR for all action bumps, not one per action
        patterns:
          - "*"
