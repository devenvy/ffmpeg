name: Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - deps.json             # the ledger — FFmpeg version bumps (.ffmpeg) AND library bumps (incl. merged Renovate PRs)
      - 'scripts/**'          # a build-recipe/logic change (incl. a dep build-SCRIPT fix) → all lines
      - '!scripts/test/**'    # ...except test-only changes, which don't affect artifacts
      # ...and except the CI validators, for the same reason. Narrow on purpose: scripts/ci also
      # holds gen-manifest.sh, select-versions.sh and impacted-versions.sh, which the release DOES
      # run, so only the *-test.sh validators are excluded. Without this, editing a test that
      # merely reads a config rebuilds 15 RIDs x 4 cells x 2 FFmpeg lines for no artifact change.
      - '!scripts/ci/*-test.sh'
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated versions to (re)build, or 'all'. Default: all tracked."
        required: false
        default: "all"

concurrency:
  group: release
  cancel-in-progress: false  # never cancel a release mid-flight

jobs:
  # Decide which version lines to (re)build this run, and compute each one's
  # next {version}.{build} tag. A push that only edits deps.json's .ffmpeg list builds just
  # the added/changed lines; a scripts/build.sh change (or a manual run) rebuilds
  # every tracked line.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.plan.outputs.builds }}      # JSON: [{version, tag}]
      versions: ${{ steps.plan.outputs.versions }}  # JSON: [version]
      any: ${{ steps.plan.outputs.any }}
    steps:
      # actions/checkout has no retry input; its internal helper makes 3 attempts with a RANDOM
      # 10-20s sleep between them, so roughly 20-40s of cover. A DNS or TLS blip longer than that
      # kills the job before any of our code runs:
      #   fatal: unable to access 'https://github.com/...': Could not resolve host: github.com
      # The action cannot be wrapped: a local composite action needs the repo ALREADY checked out,
      # and retry actions only wrap `run:` steps, not `uses:` steps. So wait for the host to be
      # reachable BEFORE checkout, with the same exponential-with-jitter backoff the build scripts
      # use (4, 8, 16, 32, 64s + jitter), and do NOT sleep after the final attempt -- nothing probes
      # again afterwards. Worst case is ~2 minutes of sleep plus the probe timeouts.
      # This never fails the job. If the host is still unreachable it warns and lets checkout run, so
      # the real error is reported by the action rather than masked here.
      - name: Wait for github.com to be reachable
        shell: bash
        run: |
          command -v curl >/dev/null 2>&1 || { echo "curl unavailable - skipping reachability wait"; exit 0; }
          delay=4
          for i in 1 2 3 4 5 6; do
            if curl -sSf -o /dev/null --max-time 10 "${GITHUB_SERVER_URL:-https://github.com}"; then
              if [ "$i" -gt 1 ]; then echo "github.com reachable after attempt ${i}"; fi
              exit 0
            fi
            if [ "$i" -eq 6 ]; then break; fi
            s=$(( delay + (RANDOM % 5) ))
            echo "github.com not reachable (attempt ${i}/6) - retrying in ${s}s" >&2
            sleep "$s"
            delay=$(( delay * 2 ))
          done
          echo "::warning::github.com still unreachable after 6 attempts; letting checkout try anyway"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for tag lookup

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_VERSIONS: ${{ inputs.versions }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mapfile -t TRACKED < <(jq -r '.ffmpeg[]' deps.json)

          BUILD_ALL=false
          SEL=()
          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            if [[ -z "${DISPATCH_VERSIONS}" || "${DISPATCH_VERSIONS}" == "all" ]]; then
              BUILD_ALL=true
            else
              read -ra SEL <<< "${DISPATCH_VERSIONS}"
            fi
          else
            # A push to main: build + release only the lines this change actually affects (shared
            # with ci.yml via scripts/ci/select-versions.sh) — a build-recipe change (scripts/**,
            # non-test) -> all lines; a deps.json bump -> only lines whose RESOLVED deps changed
            # (a line that whole-line-pins the bumped dep is NOT re-released); a deps.json's .ffmpeg list change
            # -> the added/changed lines. First push / unknown base -> all (the script can't diff).
            mapfile -t SEL < <(bash scripts/ci/select-versions.sh "${BEFORE}" "${TRACKED[@]}")
          fi
          $BUILD_ALL && SEL=("${TRACKED[@]}")

          BUILDS='[]'; VERSIONS='[]'
          for v in "${SEL[@]:-}"; do
            [[ -z "$v" ]] && continue
            IFS='.' read -ra P <<< "$v"
            while [[ ${#P[@]} -lt 3 ]]; do P+=("0"); done
            BASE="${P[0]}.${P[1]}.${P[2]}"
            LAST=$(git tag --list "${BASE}.*" --sort=-v:refname | head -1)
            if [[ -n "$LAST" ]]; then NEXT=$(( ${LAST##*.} + 1 )); else NEXT=0; fi
            TAG="${BASE}.${NEXT}"
            BUILDS=$(jq -c --arg v "$v" --arg t "$TAG" '. + [{version:$v, tag:$t}]' <<< "$BUILDS")
            VERSIONS=$(jq -c --arg v "$v" '. + [$v]' <<< "$VERSIONS")
            echo "Will build ${v} -> ${TAG}"
          done
          ANY=$([[ $(jq 'length' <<< "$VERSIONS") -gt 0 ]] && echo true || echo false)
          {
            echo "builds=${BUILDS}"
            echo "versions=${VERSIONS}"
            echo "any=${ANY}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
    uses: ./.github/workflows/build.yml
    with:
      ffmpeg_version: ${{ matrix.version }}

  # Tests gate the release: a failing test blocks the tag/publish below. Desktop and
  # mobile are separate workflows (mobile's emulator/simulator setup is isolated).
  test:
    needs: [prepare, build]
    if: needs.prepare.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
    uses: ./.github/workflows/test.yml
    with:
      ffmpeg_version: ${{ matrix.version }}

  test-mobile:
    needs: [prepare, build]
    if: needs.prepare.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
    uses: ./.github/workflows/test-mobile.yml
    with:
      ffmpeg_version: ${{ matrix.version }}

  # One tag + GitHub Release per version line.
  release:
    needs: [prepare, build, test, test-mobile]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # create every line's release even if a sibling fails
      matrix:
        build: ${{ fromJson(needs.prepare.outputs.builds) }}
    steps:
      # actions/checkout has no retry input; its internal helper makes 3 attempts with a RANDOM
      # 10-20s sleep between them, so roughly 20-40s of cover. A DNS or TLS blip longer than that
      # kills the job before any of our code runs:
      #   fatal: unable to access 'https://github.com/...': Could not resolve host: github.com
      # The action cannot be wrapped: a local composite action needs the repo ALREADY checked out,
      # and retry actions only wrap `run:` steps, not `uses:` steps. So wait for the host to be
      # reachable BEFORE checkout, with the same exponential-with-jitter backoff the build scripts
      # use (4, 8, 16, 32, 64s + jitter), and do NOT sleep after the final attempt -- nothing probes
      # again afterwards. Worst case is ~2 minutes of sleep plus the probe timeouts.
      # This never fails the job. If the host is still unreachable it warns and lets checkout run, so
      # the real error is reported by the action rather than masked here.
      - name: Wait for github.com to be reachable
        shell: bash
        run: |
          command -v curl >/dev/null 2>&1 || { echo "curl unavailable - skipping reachability wait"; exit 0; }
          delay=4
          for i in 1 2 3 4 5 6; do
            if curl -sSf -o /dev/null --max-time 10 "${GITHUB_SERVER_URL:-https://github.com}"; then
              if [ "$i" -gt 1 ]; then echo "github.com reachable after attempt ${i}"; fi
              exit 0
            fi
            if [ "$i" -eq 6 ]; then break; fi
            s=$(( delay + (RANDOM % 5) ))
            echo "github.com not reachable (attempt ${i}/6) - retrying in ${s}s" >&2
            sleep "$s"
            delay=$(( delay * 2 ))
          done
          echo "::warning::github.com still unreachable after 6 attempts; letting checkout try anyway"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ matrix.build.version }}"
          TAG="${{ matrix.build.tag }}"
          # Only the HIGHEST tracked version line gets GitHub's "Latest" badge. A
          # maintenance release on an older line (e.g. 8.1.3 published after 9.0 already
          # exists) must NOT become "Latest" — otherwise it steals the badge from the
          # newest major. GitHub's default (--latest omitted) would mis-assign this by
          # recency, so we set it explicitly per release.
          HIGHEST="$(jq -r '.ffmpeg[]' deps.json | sort -V | tail -1)"
          if [[ "${VERSION}" == "${HIGHEST}" ]]; then MARK_LATEST=true; else MARK_LATEST=false; fi
          echo "Highest tracked line: ${HIGHEST} — mark ${VERSION} as latest: ${MARK_LATEST}"
          # Retry the network git operations. These run in workflow `run:` steps, so the
          # retrying git() wrapper in scripts/lib.sh does not apply -- and a push that fails on a
          # transient blip is not cosmetic here: a release would be tagged locally but never
          # published, or an update PR branch would be committed and never pushed.
          git_net() {
            local n=1 delay=4 wait
            while :; do
              git "$@" && return 0
              if [ "$n" -ge 5 ]; then
                echo "::error::git $1 failed after $n attempts"; return 1
              fi
              wait=$(( delay + (RANDOM % 5) ))
              echo "git $1 failed (attempt $n/5) - retrying in ${wait}s" >&2
              sleep "$wait"
              delay=$(( delay * 2 )); n=$(( n + 1 ))
            done
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git_net push origin "${TAG}"
          # Created as a DRAFT and published by the `finalize` job once every asset AND the SHA256SUMS
          # manifest are in place. Previously it went public immediately with the assets uploading
          # afterwards, so any upload failure left a PUBLIC release -- possibly flagged `latest` --
          # missing artifacts or its checksums, which consumers would then fetch. A draft is invisible
          # until complete, and if a later job fails it simply stays a draft for a human to inspect.
          # --latest moves to finalize as well: it is meaningless on a draft.
          gh release create "${TAG}" \
            --title "FFmpeg ${VERSION} (build ${TAG##*.})" \
            --generate-notes \
            --draft
          echo "${MARK_LATEST}" > mark-latest.txt

  publish:
    needs: [prepare, build, test, test-mobile, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false   # one cell's failure must NOT cancel the rest — a partial release beats
                         # an empty one, and a real bug then shows in every affected cell, not just
                         # the first to hit it (which is what masked the relink_so bug as 2 failures).
      matrix:
        build: ${{ fromJson(needs.prepare.outputs.builds) }}
        rid: [linux-x64, linux-arm64, linux-armhf, linux-musl-x64, linux-musl-arm64, win-x64, win-arm64, osx-x64, osx-arm64, android-arm64, android-x64]
        license: [lgpl, gpl]
        license_version: [3, 2]   # → license token {license}v{series}: lgplv3/gplv3/lgplv2/gplv2
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.build.version }}-${{ matrix.rid }}-${{ matrix.license }}v${{ matrix.license_version }}
          path: artifacts/${{ matrix.rid }}-${{ matrix.license }}v${{ matrix.license_version }}

      - name: Create release tarballs (runtime + optional dev)
        run: |
          VERSION="${{ matrix.build.version }}"
          VARIANT="${{ matrix.rid }}-${{ matrix.license }}v${{ matrix.license_version }}"
          SRC="artifacts/${VARIANT}"
          RUN="/tmp/run"; DEV="/tmp/dev"
          rm -rf "${RUN}" "${DEV}" && mkdir -p "${RUN}"
          # actions/upload-artifact dereferences symlinks, so the downloaded lib set has the
          # SONAME/linker aliases as full COPIES (3x per .so, 2x per .dylib) — a ~3x-bloated
          # tarball. Collapse each group back to one real file (the fullest-versioned) + relative
          # symlinks, restoring the standard layout the loader expects (ffmpeg's NEEDED is the
          # SONAME). Run inside the target dir.
          relink_so() {    # ELF: libfoo.so, libfoo.so.MAJOR, libfoo.so.MAJOR.MINOR.MICRO
            local link stem f full
            for link in *.so; do
              [ -e "$link" ] || continue
              stem="${link%.so}"; full=""
              for f in "${stem}".so.*; do [ -e "$f" ] || continue; { [ -z "$full" ] || [ "${#f}" -gt "${#full}" ]; } && full="$f"; done
              [ -n "$full" ] || continue
              for f in "$link" "${stem}".so.*; do [ -e "$f" ] && [ "$f" != "$full" ] && ln -sf "$full" "$f"; done
            done
            return 0   # the final loop's last test ([ "$f" != "$full" ]) is falsy → without this
                       # the function returns 1 and `set -e` (bash -e) kills the step silently.
          }
          relink_dylib() { # Mach-O: libfoo.dylib, libfoo.MAJOR.dylib, libfoo.MAJOR.MINOR.MICRO.dylib
            # Mirror relink_so: collapse the WHOLE group to one real file plus symlinks. The previous
            # version linked only the bare libfoo.dylib, so libfoo.MAJOR.dylib stayed a second full
            # copy — upload-artifact dereferences symlinks, so it survived as real bytes. That is why
            # macOS shipped 16 real files where Linux shipped 9, carrying tens of MB of duplicate
            # payload per tarball.
            local f base full link bases=""
            for f in *.dylib; do
              [ -e "$f" ] || continue
              base="${f%%.*}"                                   # libavcodec.63.1.101.dylib -> libavcodec
              case " $bases " in *" $base "*) ;; *) bases="$bases $base" ;; esac
            done
            for base in $bases; do
              full=""
              for f in "$base".*.dylib; do                      # versioned candidates only
                [ -e "$f" ] || continue
                [ -L "$f" ] && continue                          # a real file, not an alias
                if [ -z "$full" ] || [ "${#f}" -gt "${#full}" ]; then full="$f"; fi
              done
              [ -n "$full" ] || continue
              for link in "$base.dylib" "$base".*.dylib; do
                [ -e "$link" ] || continue
                [ "$link" = "$full" ] && continue
                ln -sf "$full" "$link"
              done
            done
            return 0   # trailing tests can be falsy; the same set -e trap relink_so documents.
          }
          # Runtime tarball = binaries + shared libraries + legal ONLY. Dev files
          # (headers, and Windows import libs) go in a separate -dev tarball so the
          # runtime download stays lean. Android/iOS are link-only artifacts and
          # keep their headers in the main tarball (handled below / in publish-ios).
          case "${VARIANT}" in
            win-*)
              cp "${SRC}"/*.dll "${SRC}"/*.exe "${RUN}/"
              mkdir -p "${DEV}/include" "${DEV}/lib"
              cp -r "${SRC}/include/." "${DEV}/include/"
              cp -r "${SRC}/lib/."     "${DEV}/lib/"   # MSVC .lib import libraries
              ;;
            osx-*)
              cp "${SRC}"/*.dylib "${SRC}/ffmpeg" "${SRC}/ffprobe" "${RUN}/"
              # MoltenVK_icd.json is staged by 08_stage_artifacts.sh and docs/install/macos.md tells
              # users to point VK_ICD_FILENAMES at it, but it was never copied into the runtime
              # tarball -- the documented Vulkan setup was impossible with what actually shipped.
              if [ -f "${SRC}/MoltenVK_icd.json" ]; then cp "${SRC}/MoltenVK_icd.json" "${RUN}/"; fi
              ( cd "${RUN}" && relink_dylib )
              mkdir -p "${DEV}/include"; cp -r "${SRC}/include/." "${DEV}/include/"
              # pkg-config files are the standard integration path and belong with the headers.
              if [ -d "${SRC}/lib/pkgconfig" ]; then mkdir -p "${DEV}/lib"; cp -r "${SRC}/lib/pkgconfig" "${DEV}/lib/"; fi
              ;;
            android-*)
              # Link-only: headers + libs belong together, no runtime/dev split.
              mkdir -p "${RUN}/include" "${RUN}/lib"
              cp -r "${SRC}/include/." "${RUN}/include/"
              cp -r "${SRC}/lib/."     "${RUN}/lib/"
              ;;
            *)  # linux-*
              cp "${SRC}"/*.so* "${SRC}/ffmpeg" "${SRC}/ffprobe" "${RUN}/"
              ( cd "${RUN}" && relink_so )
              mkdir -p "${DEV}/include"; cp -r "${SRC}/include/." "${DEV}/include/"
              # pkg-config files are the standard integration path and belong with the headers.
              if [ -d "${SRC}/lib/pkgconfig" ]; then mkdir -p "${DEV}/lib"; cp -r "${SRC}/lib/pkgconfig" "${DEV}/lib/"; fi
              ;;
          esac
          if [ -d "${SRC}/legal" ]; then
            cp -r "${SRC}/legal" "${RUN}/legal"
            [ -d "${DEV}" ] && [ -n "$(ls -A "${DEV}" 2>/dev/null)" ] && cp -r "${SRC}/legal" "${DEV}/legal"
          fi
          # actions/upload-artifact does NOT preserve the executable bit, so the downloaded tree
          # has ffmpeg/ffprobe at 0644. test.yml re-chmods before testing, which hid this; the
          # release step did not, so every published Linux/macOS tarball shipped a CLI the user
          # could not run ("Permission denied", exit 126). Restore it before packaging.
          case "${VARIANT}" in
            win-*|android-*|ios-*) ;;
            *) for _b in ffmpeg ffprobe; do if [ -f "${RUN}/${_b}" ]; then chmod 0755 "${RUN}/${_b}"; fi; done ;;
          esac
          tar -czf "ffmpeg-${VERSION}-${VARIANT}.tar.gz" -C "${RUN}" .

          # Verify the ARCHIVE, not the staging tree. Every other check in CI inspects the
          # pre-release native/ directory, so a defect introduced by packaging itself -- a lost
          # permission bit, a file that never got copied -- reaches users unseen.
          case "${VARIANT}" in
            win-*|android-*|ios-*) ;;
            *)
              _v="$(mktemp -d)"; tar -xzf "ffmpeg-${VERSION}-${VARIANT}.tar.gz" -C "${_v}"
              for _b in ffmpeg ffprobe; do
                [ -x "${_v}/${_b}" ] || { echo "ERROR: ${_b} not executable inside ffmpeg-${VERSION}-${VARIANT}.tar.gz" >&2; exit 1; }
              done
              if [ "${VARIANT#osx-}" != "${VARIANT}" ] && [ -f "${SRC}/MoltenVK_icd.json" ] && [ ! -f "${_v}/MoltenVK_icd.json" ]; then
                echo "ERROR: MoltenVK_icd.json was staged but is missing from the tarball" >&2; exit 1
              fi
              # RUN it. Every other check inspects the artifact; this one uses it the way a user will,
              # and is the single test that would have caught the three defects that actually shipped:
              # a non-executable CLI, macOS binaries loading siblings by absolute build path, and an
              # Intel-runner Homebrew dylib leaking into the link. Runs only where the archive is
              # native to the runner -- a cross-built RID cannot execute here, and is covered by the
              # test-matrix under qemu/wine instead.
              _host="$(uname -s)-$(uname -m)"
              _native=""
              case "${VARIANT}:${_host}" in
                linux-x64-*:Linux-x86_64)    _native=1 ;;
                linux-arm64-*:Linux-aarch64) _native=1 ;;
                osx-x64-*:Darwin-x86_64)     _native=1 ;;
                osx-arm64-*:Darwin-arm64)    _native=1 ;;
              esac
              if [ -n "${_native}" ]; then
                _r="$(mktemp -d)"; tar -xzf "ffmpeg-${VERSION}-${VARIANT}.tar.gz" -C "${_r}"
                if ! ( cd "${_r}" && ./ffmpeg -hide_banner -version >/dev/null 2>"${_r}/err" ); then
                  echo "ERROR: ffmpeg from ffmpeg-${VERSION}-${VARIANT}.tar.gz does not run:" >&2
                  head -5 "${_r}/err" >&2
                  exit 1
                fi
                echo "archive self-test: ffmpeg runs from a clean extraction (${VARIANT})"
                rm -rf "${_r}"
              fi
              rm -rf "${_v}"
              ;;
          esac
          if [ -n "$(ls -A "${DEV}" 2>/dev/null)" ]; then
            tar -czf "ffmpeg-${VERSION}-${VARIANT}-dev.tar.gz" -C "${DEV}" .
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ matrix.build.version }}"
          VARIANT="${{ matrix.rid }}-${{ matrix.license }}v${{ matrix.license_version }}"
          # Asset upload is a mutable network operation against the API and had no retry, while every
          # other network call in this repo now has one -- and this is the worst place to lack one: the
          # release is already PUBLIC by the time these run, so a blip leaves a published release missing
          # an artifact. --clobber makes the retry idempotent: a partially-uploaded asset is replaced,
          # not duplicated.
          upload_retry() { # <file>
            local f="$1" try delay=4 wait
            for try in 1 2 3 4 5 6; do
              gh release upload "${{ matrix.build.tag }}" "${f}" --clobber \
                --repo "${{ github.repository }}" && return 0
              if [ "${try}" -eq 6 ]; then
                echo "ERROR: gh release upload ${f} failed after 6 attempts" >&2; return 1
              fi
              wait=$(( delay + (RANDOM % 5) ))
              echo "  upload of ${f} failed (attempt ${try}/6) - retrying in ${wait}s..." >&2
              sleep "${wait}"; delay=$(( delay * 2 ))
            done
          }
          upload_retry "ffmpeg-${VERSION}-${VARIANT}.tar.gz"
          if [ -f "ffmpeg-${VERSION}-${VARIANT}-dev.tar.gz" ]; then
            upload_retry "ffmpeg-${VERSION}-${VARIANT}-dev.tar.gz"
          fi

  publish-ios:
    needs: [prepare, build, test, test-mobile, release]
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false   # don't let one iOS cell's failure cancel the others
      matrix:
        build: ${{ fromJson(needs.prepare.outputs.builds) }}
        license: [lgpl, gpl]
        license_version: [3, 2]   # ios v2 = LGPLv2.1/GPLv2 (App-Store-safe): no version3
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.build.version }}-ios-arm64-${{ matrix.license }}v${{ matrix.license_version }}
          path: artifacts/ios-arm64
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.build.version }}-ios-sim-arm64-${{ matrix.license }}v${{ matrix.license_version }}
          path: artifacts/ios-sim-arm64
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.build.version }}-maccatalyst-arm64-${{ matrix.license }}v${{ matrix.license_version }}
          path: artifacts/maccatalyst-arm64
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.build.version }}-maccatalyst-x64-${{ matrix.license }}v${{ matrix.license_version }}
          path: artifacts/maccatalyst-x64

      - name: Fuse the Catalyst frameworks into one universal slice
        run: |
          # An .xcframework holds at most one framework per platform+variant, so the two Catalyst
          # RIDs must be lipo(1)-fused into a single fat binary rather than passed as two separate
          # -framework arguments (xcodebuild rejects duplicate library identifiers). Everything
          # else in the bundle -- Headers, Info.plist -- is arch-independent, so take the arm64
          # copy wholesale and replace only the executable.
          rm -rf artifacts/maccatalyst
          cp -R artifacts/maccatalyst-arm64 artifacts/maccatalyst
          for fwpath in artifacts/maccatalyst/frameworks/*.framework; do
            name=$(basename "${fwpath}" .framework)
            lipo -create \
              "artifacts/maccatalyst-arm64/frameworks/${name}.framework/${name}" \
              "artifacts/maccatalyst-x64/frameworks/${name}.framework/${name}" \
              -output "${fwpath}/${name}"
            # lipo rewrites the binary, so the ad-hoc signature from the build is now stale.
            codesign --remove-signature "${fwpath}/${name}" 2>/dev/null || true
            codesign --force --sign - --timestamp=none "${fwpath}/${name}"
            archs=$(lipo -archs "${fwpath}/${name}")
            case "${archs}" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "ERROR: ${name} Catalyst slice is not universal (got: ${archs})" >&2; exit 1 ;;
            esac
          done

      - name: Assemble xcframeworks
        run: |
          VERSION="${{ matrix.build.version }}"
          rm -rf bundle && mkdir -p bundle
          # One .xcframework per libav* library, bundling the iOS device, iOS simulator
          # and Mac Catalyst (universal arm64 + x86_64) .frameworks.
          # These are dynamic frameworks (iOS is --enable-shared); Xcode embeds + signs them in
          # the consuming app. Dynamic linking is what makes the lgplv2 build LGPLv2.1-compliant
          # (the end user can relink). Headers travel inside each .framework/Headers.
          for fwpath in artifacts/ios-arm64/frameworks/*.framework; do
            name="$(basename "${fwpath}" .framework)"
            xcodebuild -create-xcframework \
              -framework "artifacts/ios-arm64/frameworks/${name}.framework" \
              -framework "artifacts/ios-sim-arm64/frameworks/${name}.framework" \
              -framework "artifacts/maccatalyst/frameworks/${name}.framework" \
              -output "bundle/${name}.xcframework"
            # Three slices must land: ios-arm64, ios-*-simulator and ios-*-maccatalyst. If Xcode
            # ever folds two of them together the consumer silently loses a platform, so assert.
            slices=$(/usr/libexec/PlistBuddy -c "Print :AvailableLibraries" \
                       "bundle/${name}.xcframework/Info.plist" | grep -c LibraryIdentifier || true)
            if [ "${slices}" -ne 3 ]; then
              echo "ERROR: ${name}.xcframework has ${slices} slice(s), expected 3" >&2
              /usr/libexec/PlistBuddy -c "Print :AvailableLibraries" \
                "bundle/${name}.xcframework/Info.plist" >&2
              exit 1
            fi
          done
          # Attribution has to cover every binary in the bundle. The iOS device notices stay at the
          # established path so existing consumers keep working; the simulator slice is the same
          # license cell built from the same dependency set, so it is covered by them. Mac Catalyst
          # is a distinct platform arm in scripts/platform/apple.sh with its own dependency set (no
          # SecureTransport, different Vulkan/Metal choices), so its notices ship alongside rather
          # than being assumed identical.
          cp -r artifacts/ios-arm64/legal bundle/legal
          cp -r artifacts/maccatalyst/legal bundle/legal/maccatalyst
          # Nothing the Catalyst build attributed may be missing from what we ship.
          for lic in artifacts/maccatalyst/legal/licenses/*; do
            dep=$(basename "${lic}")
            if [ ! -d "bundle/legal/maccatalyst/licenses/${dep}" ]; then
              echo "ERROR: Catalyst license text for ${dep} did not reach the bundle" >&2
              exit 1
            fi
          done
          tar -czf "ffmpeg-${VERSION}-ios-${{ matrix.license }}v${{ matrix.license_version }}.tar.gz" -C bundle .

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ matrix.build.tag }}" \
            "ffmpeg-${{ matrix.build.version }}-ios-${{ matrix.license }}v${{ matrix.license_version }}.tar.gz" \
            --clobber \
            --repo "${{ github.repository }}"

  # Aggregate checksum manifest — one file covering every asset, so a downstream packager or
  # mirror verifies once instead of making an API call per asset.
  #
  # This is an INTEGRITY check, not an authenticity one, and is deliberately NOT described as
  # "signed": the manifest sits beside the artifacts and is fetched from the same place under
  # the same trust, so whoever could replace a tarball could replace this too. It catches
  # truncated/corrupted downloads and lets a consumer pin what they built against and notice
  # if an asset later changes. It does NOT establish that we published it — that needs a
  # signature anchored elsewhere (e.g. actions/attest-build-provenance).
  #
  # Digests come from the release API per-asset `digest`, i.e. what GitHub computed from the
  # bytes it stored, rather than being hashed here. That verifies the upload round-trip
  # cheaply, but nothing in this repo independently hashes the artifact.
  # Gated on BOTH publish jobs so every asset exists before the release is enumerated.
  manifest:
    needs: [prepare, publish, publish-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # If the API ever stops populating `digest`, the job silently falls back to downloading all
    # ~64 assets (several GB) under the default 360-minute budget; a short timeout turns that
    # into a fast, loud failure.
    timeout-minutes: 20
    strategy:
      matrix:
        build: ${{ fromJson(needs.prepare.outputs.builds) }}
    steps:
      # actions/checkout has no retry input; its internal helper makes 3 attempts with a RANDOM
      # 10-20s sleep between them, so roughly 20-40s of cover. A DNS or TLS blip longer than that
      # kills the job before any of our code runs:
      #   fatal: unable to access 'https://github.com/...': Could not resolve host: github.com
      # The action cannot be wrapped: a local composite action needs the repo ALREADY checked out,
      # and retry actions only wrap `run:` steps, not `uses:` steps. So wait for the host to be
      # reachable BEFORE checkout, with the same exponential-with-jitter backoff the build scripts
      # use (4, 8, 16, 32, 64s + jitter), and do NOT sleep after the final attempt -- nothing probes
      # again afterwards. Worst case is ~2 minutes of sleep plus the probe timeouts.
      # This never fails the job. If the host is still unreachable it warns and lets checkout run, so
      # the real error is reported by the action rather than masked here.
      - name: Wait for github.com to be reachable
        shell: bash
        run: |
          command -v curl >/dev/null 2>&1 || { echo "curl unavailable - skipping reachability wait"; exit 0; }
          delay=4
          for i in 1 2 3 4 5 6; do
            if curl -sSf -o /dev/null --max-time 10 "${GITHUB_SERVER_URL:-https://github.com}"; then
              if [ "$i" -gt 1 ]; then echo "github.com reachable after attempt ${i}"; fi
              exit 0
            fi
            if [ "$i" -eq 6 ]; then break; fi
            s=$(( delay + (RANDOM % 5) ))
            echo "github.com not reachable (attempt ${i}/6) - retrying in ${s}s" >&2
            sleep "$s"
            delay=$(( delay * 2 ))
          done
          echo "::warning::github.com still unreachable after 6 attempts; letting checkout try anyway"
      - uses: actions/checkout@v7

      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.build.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/ci/gen-manifest.sh "$TAG" "$REPO" > SHA256SUMS
          echo "--- SHA256SUMS ($(wc -l < SHA256SUMS) entries) ---"
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS \
            --clobber --repo "$REPO"

      # This job runs after the release is public and nothing gates on it, so a silent failure
      # would leave a release whose docs promise a SHA256SUMS that isn't there. Surface it.
      - name: Report manifest failure
        if: failure()
        run: |
          echo "### SHA256SUMS generation FAILED for \`${{ matrix.build.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "The release is published but has no checksum manifest. Re-run this job, or generate it locally with \`bash scripts/ci/gen-manifest.sh <tag> <repo>\` and upload it." >> "$GITHUB_STEP_SUMMARY"

  # The release is created as a DRAFT by `release` and becomes visible only here -- after every
  # asset (publish, publish-ios) and the SHA256SUMS manifest are attached. Before this job existed
  # the release went public first and the assets followed, so any upload failure left a PUBLIC
  # release, possibly badged `latest`, missing artifacts or checksums that consumers would fetch.
  #
  # If any earlier job fails, this one never runs and the release stays a draft: invisible,
  # complete-or-nothing, and there for a human to inspect or delete.
  #
  # MARK_LATEST is recomputed from deps.json rather than passed through: `release` is a matrix job,
  # so its outputs would be last-wins across lines, and deps.json is the same source of truth in
  # both places.
  finalize:
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false   # publish every line that made it; one line's failure must not hide another
      matrix:
        build: ${{ fromJson(needs.prepare.outputs.builds) }}
    steps:
      - uses: actions/checkout@v7
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ matrix.build.version }}"
          TAG="${{ matrix.build.tag }}"
          # Only the HIGHEST tracked line gets GitHub's "Latest" badge -- a maintenance release on
          # an older line must not steal it from the newest major. Same rule the draft was created
          # under; --latest is only meaningful once the release is no longer a draft.
          HIGHEST="$(jq -r '.ffmpeg[]' deps.json | sort -V | tail -1)"
          if [[ "${VERSION}" == "${HIGHEST}" ]]; then MARK_LATEST=true; else MARK_LATEST=false; fi
          echo "Publishing ${TAG} (latest=${MARK_LATEST})"
          delay=4
          for try in 1 2 3 4 5 6; do
            gh release edit "${TAG}" --draft=false --latest="${MARK_LATEST}"               --repo "${{ github.repository }}" && exit 0
            if [ "${try}" -eq 6 ]; then
              echo "ERROR: could not publish ${TAG} after 6 attempts - it remains a draft" >&2
              exit 1
            fi
            wait=$(( delay + (RANDOM % 5) ))
            echo "  publish failed (attempt ${try}/6) - retrying in ${wait}s..." >&2
            sleep "${wait}"; delay=$(( delay * 2 ))
          done
