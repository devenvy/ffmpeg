name: Check FFmpeg Updates

on:
  schedule:
    - cron: "0 6 * * *" # Daily, 6am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-updates
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.UPDATE_PR_TOKEN }}
      UPSTREAM: https://git.ffmpeg.org/ffmpeg.git
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # For every tracked line, look for a newer point release in its
      # major.minor series and open a bump PR. Separately, if a newer major
      # exists upstream than anything tracked, open a PR that ADDS it as a new
      # parallel line — its CI build will show whether scripts/build.sh needs a
      # tweak for the new major. Point bumps are mechanical/merge-ready; a new
      # major is a flag you enhance (new libs / build-script support) before merge,
      # so they are kept as SEPARATE PRs (the safe bump isn't blocked behind the
      # human-handled major work). Per-major matrix files keep the PRs from
      # colliding; only the shared index can, and that merges per-line.
      - name: Plan and open update PRs
        run: |
          set -euo pipefail
          git config user.name "ffmpeg-update-bot"
          git config user.email "ffmpeg-update-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # sed strips per-line whitespace (tr -d would delete the newlines too,
          # merging every version into one token).
          mapfile -t TRACKED < <(grep -vE '^[[:space:]]*(#|$)' versions.txt | sed 's/[[:space:]]//g' | grep .)

          # All upstream release tags (n<ver>), point releases only (no -rcN).
          mapfile -t ALLTAGS < <(git ls-remote --tags "${UPSTREAM}" 'refs/tags/n*' \
            | grep -v '\^{}' | sed 's|.*refs/tags/n||' | grep -vi '-' | sort -V)

          latest_in_series() { # $1 = major.minor, echoes highest matching upstream version
            local s="$1" best="" t mm
            for t in "${ALLTAGS[@]}"; do
              mm="$(cut -d. -f1,2 <<< "$t")"
              [[ "$mm" == "$s" ]] && best="$t"
            done
            echo "$best"
          }

          # Append the library-coverage gap for a version to a PR body, so a bump
          # surfaces any NEW external libraries FFmpeg gained (e.g. a codec added
          # in the new release we might want to enable). Best-effort: never fails
          # the bump if the coverage probe can't run.
          coverage_note() { # $1 = version -> echoes a markdown section
            local v="$1" out
            if out="$(bash scripts/gen-coverage.sh "$v" 2>/dev/null)"; then
              printf '\n\n---\n### Library coverage vs FFmpeg %s\n<details><summary>Libraries FFmpeg %s supports that this build does not enable</summary>\n\n```\n%s\n```\n</details>\n\nThe coverage matrix in this PR was regenerated for this version — see the updated `docs/matrix/` files.' "$v" "$v" "$out"
            fi
          }

          open_pr() { # $1 = branch, $2 = commit/PR title, $3 = PR body
            local branch="$1" title="$2" body="$3"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "  branch $branch already exists — skipping"
              return
            fi
            git checkout -B "$branch" origin/${GITHUB_REF_NAME:-main}
            git add versions.txt
            # Regenerate the coverage matrix so the PR is self-contained: a bump
            # refreshes its major's matrix, and a new major adds a dedicated
            # docs/matrix/ffmpeg-<major>.md + updates the index. Needs network to
            # fetch each version's configure; python3 + curl are on the runner.
            if bash scripts/gen-matrix.sh; then
              git add docs/matrix
            else
              echo "  WARN: matrix regeneration failed — PR will not include it" >&2
            fi
            git commit -m "$title"
            git push -u origin "$branch"
            gh pr create --title "$title" --body "$body" --base "${GITHUB_REF_NAME:-main}" --head "$branch"
            git checkout -f "${GITHUB_REF_NAME:-main}"
          }

          # 1) Point-release bumps for each tracked line.
          MAX_MAJOR=0
          for v in "${TRACKED[@]}"; do
            series="$(cut -d. -f1,2 <<< "$v")"
            major="${v%%.*}"; (( major > MAX_MAJOR )) && MAX_MAJOR="$major"
            latest="$(latest_in_series "$series")"
            if [[ -n "$latest" && "$latest" != "$v" ]] \
               && [[ "$(printf '%s\n%s\n' "$v" "$latest" | sort -V | tail -1)" == "$latest" ]]; then
              echo "Line ${series}: ${v} -> ${latest}"
              git checkout -f "${GITHUB_REF_NAME:-main}" 2>/dev/null || true
              sed -i "s/^${v//./\\.}$/${latest}/" versions.txt
              open_pr "auto/ffmpeg-${latest}" "Bump FFmpeg ${series} line to ${latest}" \
                "Automated point-release update: FFmpeg ${latest} is available in the ${series} series (was ${v}).$(coverage_note "${latest}")"
              git checkout -f versions.txt
            fi
          done

          # 2) New major line.
          NEWEST="${ALLTAGS[-1]}"
          NEW_MAJOR="${NEWEST%%.*}"
          NEW_SERIES="$(cut -d. -f1,2 <<< "$NEWEST")"
          already=false
          for v in "${TRACKED[@]}"; do
            [[ "$(cut -d. -f1,2 <<< "$v")" == "$NEW_SERIES" ]] && already=true
          done
          if (( NEW_MAJOR > MAX_MAJOR )) && ! $already; then
            echo "New major available: ${NEWEST} (tracked max major ${MAX_MAJOR})"
            git checkout -f "${GITHUB_REF_NAME:-main}" 2>/dev/null || true
            printf '%s\n' "${NEWEST}" >> versions.txt
            open_pr "auto/ffmpeg-${NEWEST}" "Add FFmpeg ${NEWEST} (new major line)" \
              "Automated: FFmpeg ${NEWEST} is a new major series upstream. This PR adds it as a parallel maintained line in \`versions.txt\`. Major bumps can change library sonames and configure flags, and a new major often supports new libraries worth enabling — so treat this as a starting point: the CI build on this PR is the check, and you may extend it with new \`deps/\` + configure flags before merging. Existing lines keep releasing independently.$(coverage_note "${NEWEST}")"
            git checkout -f versions.txt
          fi

          echo "Done."
