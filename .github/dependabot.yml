# The actions the workflows use (ffmpeg.lock is kept current by update-lock.yml, not Dependabot): one grouped PR a week,
# each release a week old first, merged by ci.yml once it passes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
      exclude: ['devenvy/*'] # the engine's workflows arrive without delay
    groups:
      actions:
        patterns: ['*']
