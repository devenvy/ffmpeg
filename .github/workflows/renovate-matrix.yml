name: Renovate matrix sync

# Renovate edits deps.json but cannot run scripts/gen-matrix.sh, so every ledger bump it opens
# lands with a stale docs/matrix. That is not a cosmetic failure: ci.yml's build-matrix declares
#   needs: [resolve, docs-matrix]
# and a failed dependency SKIPS the dependent job whatever its `if:` says, so a red docs-matrix
# silently cancelled the entire build/test fan-out. PR #31 sat at 13 checks instead of 128 and had
# validated nothing about the bump it proposed -- the opposite of what renovate.yml's own header
# promises ("CI (build + docs-matrix) then validates that bump across every FFmpeg line").
#
# So regenerate the matrices on the Renovate branch itself and push them back. The push uses
# UPDATE_PR_TOKEN rather than GITHUB_TOKEN specifically so the PR's checks re-run -- a
# GITHUB_TOKEN push does not trigger workflows, which would leave the PR red forever.

on:
  push:
    branches:
      - 'renovate/**'
    paths:
      - deps.json

permissions:
  contents: read      # the push uses UPDATE_PR_TOKEN, not GITHUB_TOKEN

concurrency:
  # Per branch, and cancel superseded runs: if Renovate force-pushes an updated bump while this is
  # still regenerating, the older run's matrices are already wrong.
  group: renovate-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    # ubuntu-latest for the same reason ci.yml's docs-matrix uses it: ANDROID_NDK_LATEST_HOME is
    # preinstalled, which gen-matrix.sh needs for the android rows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.UPDATE_PR_TOKEN }}

      # Belt and braces against a push loop. The no-drift exit below is the real terminator (run 2
      # regenerates, finds nothing to commit, stops), but that relies on gen-matrix.sh being
      # deterministic. If it ever is not, this stops the loop at one extra cycle instead of
      # hammering the branch.
      - name: Skip if this push was our own regeneration
        id: guard
        run: |
          if [ "$(git log -1 --pretty=%an)" = "ffmpeg-update-bot" ]; then
            echo "last commit is ours - nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the coverage matrices and push if they drifted
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          bash scripts/gen-matrix.sh
          if git diff --quiet -- docs/matrix; then
            echo "docs/matrix already current - nothing to push"
            exit 0
          fi
          echo "docs/matrix drifted; regenerated:"
          git diff --stat -- docs/matrix
          git config user.name  "ffmpeg-update-bot"
          git config user.email "ffmpeg-update-bot@users.noreply.github.com"
          git add docs/matrix
          # Separate -m flags rather than one multi-line string: a literal newline inside the
          # YAML block scalar would need its own indentation and end up inside the message.
          git commit \
            -m "docs(matrix): regenerate for this dependency bump" \
            -m "Renovate edits deps.json but cannot run scripts/gen-matrix.sh, so docs-matrix would fail and, because build-matrix needs it, skip the whole build/test fan-out. Generated by .github/workflows/renovate-matrix.yml."
          # No --force: this only ever appends, and a non-fast-forward here means Renovate
          # rewrote the branch underneath us, in which case the newer run should win.
          git push origin "HEAD:${GITHUB_REF_NAME}"
