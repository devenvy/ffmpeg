name: Check for a new FFmpeg major line

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly, Monday 6am UTC (a new FFmpeg major is a rare event)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-updates
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.UPDATE_PR_TOKEN }}
      UPSTREAM: https://git.ffmpeg.org/ffmpeg.git
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Point releases (a newer release within the major) are handled by Renovate now (grouped with the library
      # bumps into one PR). This workflow does only what Renovate can't: when a newer FFmpeg
      # MAJOR appears upstream than anything tracked, open a PR that ADDS it as a new parallel
      # line in deps.json's .ffmpeg list. A new major is a flag you enhance (new sonames / configure flags /
      # libraries worth enabling) before merge — its CI build is the check. Kept separate from
      # the mechanical point/lib bumps that Renovate merges.
      - name: Add a new FFmpeg major line if one appeared
        run: |
          set -euo pipefail
          git config user.name "ffmpeg-update-bot"
          git config user.email "ffmpeg-update-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # The maintained FFmpeg lines live in the ledger now (deps.json .ffmpeg).
          mapfile -t TRACKED < <(jq -r '.ffmpeg[]' deps.json)

          # All upstream release tags (n<ver>), point releases only (no -rcN).
          mapfile -t ALLTAGS < <(git ls-remote --tags "${UPSTREAM}" 'refs/tags/n*' \
            | grep -v '\^{}' | sed 's|.*refs/tags/n||' | grep -vi '-' | sort -V)

          # Append the library-coverage gap for a version to a PR body, so a bump
          # surfaces any NEW external libraries FFmpeg gained (e.g. a codec added
          # in the new release we might want to enable). Best-effort: never fails
          # the bump if the coverage probe can't run.
          coverage_note() { # $1 = version -> echoes a markdown section
            local v="$1" out
            if out="$(bash scripts/gen-coverage.sh "$v" 2>/dev/null)"; then
              printf '\n\n---\n### Library coverage vs FFmpeg %s\n<details><summary>Libraries FFmpeg %s supports that this build does not enable</summary>\n\n```\n%s\n```\n</details>\n\nThe coverage matrix in this PR was regenerated for this version — see the updated `docs/matrix/` files.' "$v" "$v" "$out"
            fi
          }

          open_pr() { # $1 = branch, $2 = commit/PR title, $3 = PR body
            local branch="$1" title="$2" body="$3"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "  branch $branch already exists — skipping"
              return
            fi
            git checkout -B "$branch" origin/${GITHUB_REF_NAME:-main}
            git add deps.json renovate.json
            # Regenerate the coverage matrix so the PR is self-contained: a bump
            # refreshes its major's matrix, and a new major adds a dedicated
            # docs/matrix/ffmpeg-<major>.md + updates the index. Needs network to
            # fetch each version's configure; python3 + curl are on the runner.
            if bash scripts/gen-matrix.sh; then
              git add docs/matrix
            else
              echo "  WARN: matrix regeneration failed — PR will not include it" >&2
            fi
            git commit -m "$title"
            git push -u origin "$branch"
            gh pr create --title "$title" --body "$body" --base "${GITHUB_REF_NAME:-main}" --head "$branch"
            git checkout -f "${GITHUB_REF_NAME:-main}"
          }

          # Point-release bumps (a newer release within the major) are handled by Renovate now (renovate.json's
          # deps.json's .ffmpeg list manager), grouped with the library bumps into one PR. This workflow only
          # does what Renovate can't — compute the highest tracked major, then (below) add a NEW
          # major as a parallel line when one appears upstream.
          MAX_MAJOR=0
          for v in "${TRACKED[@]}"; do major="${v%%.*}"; (( major > MAX_MAJOR )) && MAX_MAJOR="$major"; done

          # New major line: the newest upstream release whose MAJOR is above everything tracked.
          # A newer minor/patch of a major we already track (9.0.1 -> 9.0.2 or 9.1.0) is just a
          # stability point in that series — Renovate bumps the existing line to it, so it is NOT a
          # new line and never reaches here.
          NEWEST="${ALLTAGS[-1]}"
          NEW_MAJOR="${NEWEST%%.*}"
          if (( NEW_MAJOR > MAX_MAJOR )); then
            echo "New major available: ${NEWEST} (tracked max major ${MAX_MAJOR})"
            git checkout -f "${GITHUB_REF_NAME:-main}" 2>/dev/null || true
            # Add the new line to the ledger (.ffmpeg) AND its per-major Renovate rule, so once this
            # PR merges Renovate keeps the new line current (any newer release within the major).
            jq --arg v "${NEWEST}" '.ffmpeg += [$v]' deps.json > deps.tmp && mv deps.tmp deps.json
            SERIES_RE="/^${NEW_MAJOR}\\./"
            jq --arg re "${SERIES_RE}" \
              '.packageRules += [{"matchPackageNames":["https://github.com/FFmpeg/FFmpeg.git"],"matchCurrentVersion":$re,"allowedVersions":$re}]' \
              renovate.json > rn.tmp && mv rn.tmp renovate.json
            open_pr "auto/ffmpeg-${NEWEST}" "Add FFmpeg ${NEWEST} (new major line)" \
              "Automated: FFmpeg ${NEWEST} is a new major series upstream. This PR adds it to the ledger (\`deps.json\` \`.ffmpeg\`) plus a Renovate per-series rule so its point releases are tracked from here on. Major bumps can change library sonames and configure flags, and a new major often supports new libraries worth enabling — treat this as a starting point: the CI build on this PR is the check, and you may extend it with new \`deps/\` + configure flags before merging. Existing lines keep releasing independently.$(coverage_note "${NEWEST}")"
            git checkout -f deps.json renovate.json
          fi

          echo "Done."
