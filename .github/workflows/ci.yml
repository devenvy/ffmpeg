# The pull-request check: is ffmpeg-build.yml valid, does ffmpeg.lock cover it, can every target be planned? It builds
# nothing (the daily release builds and tests every target before it publishes, and keeps a release that fails a
# draft), so it takes a minute. It merges the lock updates (update-lock.yml) and Dependabot's PRs once it passes.
# The lint job checks the workflows (actionlint, zizmor). `result` is the check the main ruleset requires.
name: CI
on:
  pull_request:
  workflow_dispatch: # update-lock.yml starts it on its PR's branch (GITHUB_TOKEN's pushes start nothing)

# a newer push to the same branch replaces the run under way
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    uses: devenvy/ffmpeg-build/.github/workflows/check.yml@f8b45a38a7b7b63f2697a45ee608103f24c874ea # v0.0.9
    permissions:
      contents: read
  # the workflows: actionlint (mistakes) and zizmor (GitHub Actions security)
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false # fail the job on findings instead of uploading SARIF
  # one check for the main ruleset to require, whatever ran
  result:
    needs: [check, lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: the check and lint passed
        env:
          CHECK: ${{ needs.check.result }}
          LINT: ${{ needs.lint.result }}
        run: test "${CHECK}" = success && test "${LINT}" = success
  merge:
    needs: result
    uses: devenvy/ffmpeg-build/.github/workflows/automerge.yml@f8b45a38a7b7b63f2697a45ee608103f24c874ea # v0.0.9
    permissions:
      contents: write
      pull-requests: write

  # Dependabot's PRs merge themselves once the required check passes, as devenvy-bot (org variable
  # DEVENVY_BOT_CLIENT_ID, org secret DEVENVY_BOT_PRIVATE_KEY, both also Dependabot secrets).
  dependabot-auto-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DEVENVY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEVENVY_BOT_PRIVATE_KEY }}
          # enabling auto-merge
          permission-contents: write
          permission-pull-requests: write
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
