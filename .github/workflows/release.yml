# The daily release: publishes every release whose builds changed since it was last published (a merged lock update,
# a new FFmpeg release, a new engine). Back-to-back merges cost one release; a failed day is retried the next.
#
# Permissions: contents: write (below), to create the GitHub releases.
name: Release
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  release:
    uses: devenvy/ffmpeg-build/.github/workflows/build.yml@d13c421eccfb521683fd03234056639cf1038e21 # v0.0.13
    permissions:
      contents: write # the GitHub releases
    with:
      publish: changed-only
