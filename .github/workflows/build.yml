name: Build FFmpeg

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ffmpeg_version:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
      fail_fast:
        required: false
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      matrix:
        rid: [linux-x64, linux-arm64, linux-armhf, linux-musl-x64, linux-musl-arm64, win-x64, win-arm64, osx-x64, osx-arm64, android-arm64, android-x64, ios-arm64, ios-sim-arm64]
        license: [lgpl, gpl]
        # License version series. 3 = (L)GPLv3 (OpenSSL 3.x TLS + Vulkan on Linux/Android, both
        # Apache-2.0). 2 = LGPLv2.1 / GPLv2 (App-Store-safe): Vulkan dropped everywhere; on
        # Linux/Android, gplv2 gets GnuTLS but lgplv2 ships with NO TLS backend at all (GnuTLS's
        # deps can't stay LGPLv2.1). Apple/Windows are unaffected by any of this — they keep their
        # native SecureTransport/SChannel TLS in every cell, v3 or v2.
        license_version: [3, 2]
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: linux-armhf
            runner: ubuntu-latest
            # Build inside Debian Bookworm (glibc 2.36), not on the bare runner. The runner image
            # ships glibc 2.38, and cross-compiling against ITS headers raised the armhf floor to
            # 2.38 -- visible as __isoc23_* imports in the published libraries. Raspberry Pi OS
            # Bookworm and Debian 12 ship 2.36, so armhf could not run on the hardware armhf
            # mostly exists for, and it contradicted the 2.28 floor documented in
            # docs/install/linux.md. Bookworm is the oldest base that still satisfies the Node 20
            # runtime the JS actions need (glibc 2.28+).
            container: debian:bookworm
          - rid: linux-musl-x64
            runner: ubuntu-latest
            container: alpine:latest
          # No container: here (unlike linux-musl-x64) — GitHub only supports
          # JavaScript actions in Alpine containers on x64 runners, so this RID
          # instead docker-runs alpine:latest itself in the build step below,
          # keeping actions/checkout etc. on the host's glibc Node runtime.
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
          - rid: win-x64
            runner: ubuntu-latest
          - rid: win-arm64
            runner: ubuntu-latest
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-latest
          - rid: android-arm64
            runner: ubuntu-latest
          - rid: android-x64
            runner: ubuntu-latest
          - rid: ios-arm64
            runner: macos-latest
          - rid: ios-sim-arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    name: ${{ inputs.ffmpeg_version }} ${{ matrix.rid }} (${{ matrix.license }}v${{ matrix.license_version }})

    env:
      BUILD_RID: ${{ matrix.rid }}
      BUILD_LICENSE: ${{ matrix.license }}
      BUILD_LICENSE_VERSION: ${{ matrix.license_version }}
      # Artifact names must be unique across every version/license/series in one run.
      # License token = {license}v{series}: lgplv3 | gplv3 | lgplv2 | gplv2 (lgplv2 = LGPLv2.1).
      VARIANT: ${{ inputs.ffmpeg_version }}-${{ matrix.rid }}-${{ matrix.license }}v${{ matrix.license_version }}
      # Embedded into legal/SOURCE_OFFER.txt so the corresponding-source notice
      # points at this exact repo + commit.
      SOURCE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      SOURCE_REPO_REF: ${{ inputs.ref || github.sha }}

    steps:
      - name: Bootstrap container (Alpine or Debian)
        if: matrix.container
        # Was gated on `matrix.container` merely being SET and hardcoded apk, which broke the
        # moment a second container image appeared: linux-armhf now builds in debian:bookworm
        # (for its glibc floor) and died with "apk: not found". Pick the package manager from
        # the image instead of assuming Alpine.
        shell: sh -e {0}
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash git file jq   # 'file' for the test script, 'jq' for the dep loader
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            # python3-pip: Debian ships none, and 03_install_packages.sh needs pip to pull a meson
            # newer than the distro's (bookworm has 1.0.1; fontconfig 2.18+ wants >= 1.11). Without
            # it the job died on "No module named pip" after an otherwise clean apt run.
            apt-get install -y -q --no-install-recommends bash git file jq ca-certificates curl sudo python3-pip
          else
            echo "unsupported container image: no apk or apt-get" >&2; exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # github.sha, NOT github.ref: for a push run github.ref is refs/heads/main, so each
          # matrix cell would check out whatever main's tip is when that cell STARTS. Across a
          # multi-hour matrix that lets different cells build different commits, and none of
          # them need be the commit the release tags. github.sha is the immutable event SHA and
          # is shared with the calling workflow, so every cell builds exactly one tree.
          ref: ${{ inputs.ref || github.sha }}

      - name: Build FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BUILD_RID}" == android-* ]]; then
            export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
            echo "Using Android NDK: ${ANDROID_NDK_HOME}"
          fi
          mkdir -p "artifacts/${BUILD_RID}/logs"
          {
            if command -v gcc &>/dev/null; then
              echo "gcc: $(gcc --version | head -1)"
            fi
            if command -v clang &>/dev/null; then
              echo "clang: $(clang --version | head -1)"
            fi
            echo "nasm: $(nasm --version 2>/dev/null || echo 'not installed')"
            echo "pkg-config: $(pkg-config --version 2>/dev/null || echo 'not installed')"
          } > "artifacts/${BUILD_RID}/logs/toolchain.txt"
          chmod +x scripts/build.sh
          export FFMPEG_VERSION="${{ inputs.ffmpeg_version }}"
          if [[ "${BUILD_RID}" == "linux-x64" || "${BUILD_RID}" == "linux-arm64" ]]; then
            # Build in the STOCK upstream manylinux_2_28 image (glibc 2.28) for a low
            # runtime floor. The image is pulled unmodified from quay.io/pypa — there is
            # no custom image to maintain; 03_install_packages.sh provisions the
            # toolchain inside it (triggered by BUILD_CONTAINER=manylinux). Artifacts
            # land in the mounted workspace; the test/upload steps below run on the HOST
            # against them — which also proves the low-floor binary runs on the runner's
            # newer glibc.
            case "${BUILD_RID}" in
              linux-x64)   MANYLINUX_ARCH=x86_64 ;;
              linux-arm64) MANYLINUX_ARCH=aarch64 ;;
            esac
            docker run --rm -v "${PWD}:/work" -w /work \
              -e BUILD_RID -e BUILD_LICENSE -e BUILD_LICENSE_VERSION -e FFMPEG_VERSION -e BUILD_CONTAINER=manylinux \
              -e SOURCE_REPO_URL -e SOURCE_REPO_REF \
              "quay.io/pypa/manylinux_2_28_${MANYLINUX_ARCH}" \
              bash -c 'chmod +x scripts/build.sh && ./scripts/build.sh' \
              2>&1 | tee "artifacts/${BUILD_RID}/logs/build.log"
            # Container ran as root — hand the outputs back to the runner user so the
            # host-side test/upload steps can read/clean them.
            sudo chown -R "$(id -u):$(id -g)" artifacts .build 2>/dev/null || true
          elif [[ "${BUILD_RID}" == "linux-musl-arm64" ]]; then
            # Same reasoning as linux-x64/linux-arm64 above, but for musl: GitHub
            # only supports JavaScript actions in Alpine containers on x64 runners,
            # so this arm64 runner docker-runs alpine:latest for the build itself
            # rather than using `container:` on the job (which breaks actions/checkout
            # here — see linux-musl-x64, which stays on `container:` because its
            # x64 runner *is* supported). BUILD_CONTAINER is intentionally NOT set
            # to manylinux — 03_install_packages.sh must still take its
            # linux-musl-* apk branch inside this container.
            docker run --rm -v "${PWD}:/work" -w /work \
              -e BUILD_RID -e BUILD_LICENSE -e BUILD_LICENSE_VERSION -e FFMPEG_VERSION \
              -e SOURCE_REPO_URL -e SOURCE_REPO_REF \
              alpine:latest \
              sh -c 'apk add --no-cache bash git file jq && chmod +x scripts/build.sh && ./scripts/build.sh' \
              2>&1 | tee "artifacts/${BUILD_RID}/logs/build.log"
            # Container ran as root — hand the outputs back to the runner user so the
            # host-side test/upload steps can read/clean them.
            sudo chown -R "$(id -u):$(id -g)" artifacts .build 2>/dev/null || true
          else
            ./scripts/build.sh 2>&1 | tee "artifacts/${BUILD_RID}/logs/build.log"
          fi

      # Tests run in the separate test.yml workflow (chained after this one), which
      # downloads the artifact uploaded below and runs the per-platform checks —
      # keeping build and test decoupled so tests can grow / re-run independently.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VARIANT }}
          path: artifacts/${{ matrix.rid }}/native
          if-no-files-found: error
          # 5, not 1: the release workflow reuses these build artifacts in its publish jobs, and a
          # full release run (80 build cells + tests, queuing on scarce macOS runners) can take
          # ~24h end-to-end. At retention-days:1 the earliest-finishing artifacts (e.g. the lean
          # ios-sim slice) expired before publish could download them → "Artifact not found". Five
          # days gives comfortable margin over the longest observed run; they're throwaway either way.
          retention-days: 5

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ env.VARIANT }}-diagnostics
          path: |
            artifacts/${{ matrix.rid }}/build-info.txt
            artifacts/${{ matrix.rid }}/logs/
            .build/${{ matrix.rid }}/src/ffbuild/config.log
            .build/${{ matrix.rid }}/src/ffbuild/config.mak
            .build/${{ matrix.rid }}/libvpx/config.log
          if-no-files-found: warn
          retention-days: 1

  # Gate job — single required status check for branch protection
  all-builds:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more build jobs failed"
            exit 1
          fi
