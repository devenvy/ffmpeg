name: Test (desktop)

# Desktop/server execution tests against the artifacts from build.yml: download
# each variant and RUN it (version, filter/decoder/protocol enumeration incl.
# https/tls, an encode->decode round-trip) on a runner where the target executes
# natively — Linux on Linux, Windows on Windows, macOS on macOS. Mobile (Android/
# iOS) is deliberately a SEPARATE workflow (test-mobile.yml): its emulator/simulator
# setup is slow and fiddly and shouldn't gate or destabilise these fast checks.
# Chained after build.yml by ci.yml and release.yml.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ffmpeg_version:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
      fail_fast:
        required: false
        type: boolean
        default: false

jobs:
  test:
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      matrix:
        rid: [linux-x64, linux-arm64, linux-armhf, linux-musl-x64, linux-musl-arm64, win-x64, win-arm64, osx-x64, osx-arm64]
        license: [lgpl, gpl]
        # v3 = OpenSSL 3.x TLS + Vulkan on Linux/Android. v2 = Vulkan dropped everywhere; on
        # Linux/Android, gplv2 gets GnuTLS but lgplv2 has NO TLS backend at all. Apple/Windows
        # keep their native SecureTransport/SChannel TLS in every cell, v3 or v2.
        license_version: [3, 2]
        include:
          # Tests run where the target executes natively. The glibc Linux builds test
          # on the PLAIN Ubuntu runner (not the manylinux build container) — running
          # the low-glibc-floor binary on the runner's newer glibc also proves
          # portability. Windows tests run on a real Windows runner (native .exe, no
          # Wine).
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: linux-armhf
            runner: ubuntu-latest
          - rid: linux-musl-x64
            runner: ubuntu-latest
            container: alpine:latest
          # No container: here (unlike linux-musl-x64) — GitHub only supports
          # JavaScript actions in Alpine containers on x64 runners, so this RID
          # instead docker-runs alpine:latest itself in the Test artifact step
          # below, keeping actions/checkout etc. on the host's glibc Node runtime.
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
          - rid: win-x64
            runner: windows-latest
          # GitHub's Windows-on-ARM runner: the artifact is an ARM64 binary, so it
          # executes natively here rather than under emulation.
          - rid: win-arm64
            runner: windows-11-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    name: ${{ inputs.ffmpeg_version }} ${{ matrix.rid }} (${{ matrix.license }}v${{ matrix.license_version }})

    env:
      BUILD_RID: ${{ matrix.rid }}
      VARIANT: ${{ inputs.ffmpeg_version }}-${{ matrix.rid }}-${{ matrix.license }}v${{ matrix.license_version }}

    steps:
      - name: Bootstrap Alpine container
        if: matrix.container
        # file: arch check. binutils: nm/strings for symbol and capability checks.
        # patchelf: the musl C++ runtime invariant below is verified with it, and without it
        # that check fails loudly rather than being skipped.
        # libstdc++/libgcc are installed for the TEST HOST only, and deliberately NOT because
        # the artifact needs them: the artifact links the C++ runtime statically and must run on
        # a bare Alpine image with nothing installed -- scripts/test/linux.sh asserts exactly
        # that. They are here so the container can build and run the smoke program. (This
        # comment previously said they were "a standard runtime dep ... not something we can
        # avoid", which was true of the artifacts as published and is the very thing this
        # branch fixed.)
        # curl: fetch the (now mandatory) whisper model — Alpine has no curl by default, and
        # its absence previously made the model download silently fail (whisper skipped).
        run: apk add --no-cache bash git file binutils libstdc++ libgcc curl build-base patchelf

      # actions/checkout has no retry input; its internal helper makes 3 attempts with a RANDOM
      # 10-20s sleep between them, so roughly 20-40s of cover. A DNS or TLS blip longer than that
      # kills the job before any of our code runs:
      #   fatal: unable to access 'https://github.com/...': Could not resolve host: github.com
      # The action cannot be wrapped: a local composite action needs the repo ALREADY checked out,
      # and retry actions only wrap `run:` steps, not `uses:` steps. So wait for the host to be
      # reachable BEFORE checkout, with the same exponential-with-jitter backoff the build scripts
      # use (4, 8, 16, 32, 64s + jitter), and do NOT sleep after the final attempt -- nothing probes
      # again afterwards. Worst case is ~2 minutes of sleep plus the probe timeouts.
      # This never fails the job. If the host is still unreachable it warns and lets checkout run, so
      # the real error is reported by the action rather than masked here.
      - name: Wait for github.com to be reachable
        shell: bash
        run: |
          command -v curl >/dev/null 2>&1 || { echo "curl unavailable - skipping reachability wait"; exit 0; }
          delay=4
          for i in 1 2 3 4 5 6; do
            if curl -sSf -o /dev/null --max-time 10 "${GITHUB_SERVER_URL:-https://github.com}"; then
              if [ "$i" -gt 1 ]; then echo "github.com reachable after attempt ${i}"; fi
              exit 0
            fi
            if [ "$i" -eq 6 ]; then break; fi
            s=$(( delay + (RANDOM % 5) ))
            echo "github.com not reachable (attempt ${i}/6) - retrying in ${s}s" >&2
            sleep "$s"
            delay=$(( delay * 2 ))
          done
          echo "::warning::github.com still unreachable after 6 attempts; letting checkout try anyway"
      - uses: actions/checkout@v7
        with:
          # github.sha, NOT github.ref: for a push run github.ref is refs/heads/main, so each
          # matrix cell would check out whatever main's tip is when that cell STARTS. Across a
          # multi-hour matrix that lets different cells build different commits, and none of
          # them need be the commit the release tags. github.sha is the immutable event SHA and
          # is shared with the calling workflow, so every cell builds exactly one tree.
          ref: ${{ inputs.ref || github.sha }}

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.VARIANT }}
          path: artifacts/${{ matrix.rid }}/native

      - name: Restore executable bits
        shell: bash
        run: |
          # actions/upload-artifact does not preserve the executable bit, so the
          # downloaded ffmpeg/ffprobe come back non-executable. Restore them.
          for exe in ffmpeg ffprobe ffmpeg.exe ffprobe.exe; do
            f="artifacts/${BUILD_RID}/native/${exe}"
            [ -f "$f" ] && chmod +x "$f" || true
          done

      # Cache a tiny GGML Whisper model so the test runs a REAL af_whisper CPU inference (not just a
      # filter-registered check). Stored in the workspace (relative path — works uniformly on every
      # OS incl. the native Windows .exe, unlike a git-bash ~/ path) and cached across runs.
      - name: Cache Whisper model
        id: whisper-cache
        uses: actions/cache@v6
        with:
          path: whisper-model/ggml-tiny.en.bin
          key: whisper-ggml-tiny-en-v1
      # Mandatory, not best-effort: the inference is a gating test, so a failed fetch must fail the
      # job (loud) rather than silently drop the check. Cache + retries keep transient HF blips rare.
      - name: Fetch Whisper model (mandatory)
        shell: bash
        run: |
          m="whisper-model/ggml-tiny.en.bin"
          mkdir -p whisper-model
          if [ ! -f "$m" ]; then
            # Every matrix cell races for this file on a cold cache, and Hugging Face answers the
            # herd with 429. curl's own --retry uses a FIXED delay, so 6 attempts were spent inside
            # ~25s and the job failed while the rate-limit window was still open. Back off
            # progressively with jitter instead: the cells spread themselves out and later ones find
            # the window clear. Worst case is ~7min of waiting, against a >2h matrix.
            url="https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin"
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors "$url" -o "$m"; then
                ok=1; break
              fi
              echo "whisper model fetch attempt ${attempt}/8 failed; backing off" >&2
              sleep $(( attempt * 15 + (RANDOM % 20) ))
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::whisper model fetch failed after 8 attempts"; exit 1
            fi
            # A short file means a truncated transfer or an error page that still exited 0.
            # The model is 77704715 bytes; anything under 70MB is not it.
            sz=$(wc -c < "$m")
            if [ "$sz" -lt 70000000 ]; then
              echo "::error::whisper model is only ${sz} bytes — truncated download"; rm -f "$m"; exit 1
            fi
          fi
          # Pass a RELATIVE, colon-free path: the test runs from the workspace (run_functional never
          # cd's), so ffmpeg resolves it against cwd on every OS — and unlike an absolute Windows path
          # it has no drive-letter ':' to collide with af_whisper's option separator in the filtergraph.
          echo "WHISPER_MODEL=$m" >> "$GITHUB_ENV"

      # linux-armhf is 32-bit ARM (ARMv7): NO hosted runner executes it natively — the arm64
      # runners are Ampere/Neoverse-N1, which dropped AArch32. So it MUST run under qemu-user.
      # FFmpeg's third-party deps are static-linked into libav*, so the only dynamic deps are the
      # base C/C++ runtime — supplied here via the armhf cross-runtime packages (on the amd64
      # archive; they install under /usr/arm-linux-gnueabihf, exactly where linux.sh points qemu's
      # -L sysroot). Without this the functional suite now FAILS rather than silently skipping.
      - name: Set up qemu-user + armhf runtime (functional cross-test)
        if: matrix.rid == 'linux-armhf'
        shell: bash
        run: |
          sudo apt-get update -qq
          # gcc-arm-linux-gnueabihf: the -dev smoke link must BUILD for armv7, not just run it
          # under qemu. Keep the package list on ONE line: an escaped newline written into this
          # file literally becomes an argument, and apt then reports it as a missing package.
          sudo apt-get install -y -q qemu-user libc6-armhf-cross libstdc++6-armhf-cross libgcc-s1-armhf-cross gcc-arm-linux-gnueabihf

      - name: Test artifact
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/test.sh scripts/test/*.sh
          if [[ "${BUILD_RID}" == "linux-musl-arm64" ]]; then
            # Same reasoning as the build job: GitHub only supports JavaScript
            # actions in Alpine containers on x64 runners, so this arm64 runner
            # docker-runs alpine:latest for the test itself instead of using
            # `container:` on the job (which breaks actions/checkout — see
            # linux-musl-x64, which stays on `container:` because its x64
            # runner *is* supported).
            # `docker run` pulls the image implicitly, and that pull is a NETWORK operation with no
            # retry of any kind -- a registry blip takes the whole build down for a reason that is not
            # our code, which is the failure class the curl/git wrappers exist to remove. Observed on
            # this branch: "docker: Error response from daemon: received unexpected HTTP status:
            # 502 Bad Gateway" pulling quay.io/pypa/manylinux_2_28_x86_64.
            #
            # Pull explicitly first, with the same exponential+jitter backoff scripts/lib.sh uses, so
            # `docker run` below finds the image locally. Retrying the PULL rather than the `docker run`
            # matters: re-running the run would repeat the entire build.
            _img="alpine:latest"
            _delay=4
            for _try in 1 2 3 4 5 6; do
              docker pull "${_img}" && break
              if [ "${_try}" -eq 6 ]; then
                echo "ERROR: docker pull ${_img} failed after 6 attempts" >&2; exit 1
              fi
              _wait=$(( _delay + (RANDOM % 5) ))
              echo "  docker pull failed (attempt ${_try}/6) - retrying in ${_wait}s..." >&2
              sleep "${_wait}"
              _delay=$(( _delay * 2 ))
            done
            docker run --rm -v "${PWD}:/work" -w /work \
              -e BUILD_RID -e WHISPER_MODEL \
              "${_img}" \
              sh -c 'apk add --no-cache bash git file binutils libstdc++ libgcc curl build-base patchelf && chmod +x scripts/test.sh scripts/test/*.sh && bash scripts/test.sh "${BUILD_RID}" "artifacts/${BUILD_RID}/native"'
          else
            bash scripts/test.sh "${BUILD_RID}" "artifacts/${BUILD_RID}/native"
          fi


  # Gate job — single required status check for branch protection.
  all-tests:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more desktop test jobs failed"
            exit 1
          fi
