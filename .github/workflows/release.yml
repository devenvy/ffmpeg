name: Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - deps.json             # the ledger — FFmpeg version bumps (.ffmpeg) AND library bumps (incl. merged Renovate PRs)
      - 'scripts/**'          # a build-recipe/logic change (incl. a dep build-SCRIPT fix) → all lines
      - '!scripts/test/**'    # ...except test-only changes, which don't affect artifacts
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated versions to (re)build, or 'all'. Default: all tracked."
        required: false
        default: "all"

concurrency:
  group: release
  cancel-in-progress: false  # never cancel a release mid-flight

jobs:
  # Decide which version lines to (re)build this run, and compute each one's
  # next {version}.{build} tag. A push that only edits deps.json's .ffmpeg list builds just
  # the added/changed lines; a scripts/build.sh change (or a manual run) rebuilds
  # every tracked line.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.plan.outputs.builds }}      # JSON: [{version, tag}]
      versions: ${{ steps.plan.outputs.versions }}  # JSON: [version]
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for tag lookup

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_VERSIONS: ${{ inputs.versions }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mapfile -t TRACKED < <(jq -r '.ffmpeg[]' deps.json)

          BUILD_ALL=false
          SEL=()
          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            if [[ -z "${DISPATCH_VERSIONS}" || "${DISPATCH_VERSIONS}" == "all" ]]; then
              BUILD_ALL=true
            else
              read -ra SEL <<< "${DISPATCH_VERSIONS}"
            fi
          else
            # A push to main: build + release only the lines this change actually affects (shared
            # with ci.yml via scripts/ci/select-versions.sh) — a build-recipe change (scripts/**,
            # non-test) -> all lines; a deps.json bump -> only lines whose RESOLVED deps changed
            # (a line that whole-line-pins the bumped dep is NOT re-released); a deps.json's .ffmpeg list change
            # -> the added/changed lines. First push / unknown base -> all (the script can't diff).
            mapfile -t SEL < <(bash scripts/ci/select-versions.sh "${BEFORE}" "${TRACKED[@]}")
          fi
          $BUILD_ALL && SEL=("${TRACKED[@]}")

          BUILDS='[]'; VERSIONS='[]'
          for v in "${SEL[@]:-}"; do
            [[ -z "$v" ]] && continue
            IFS='.' read -ra P <<< "$v"
            while [[ ${#P[@]} -lt 3 ]]; do P+=("0"); done
            BASE="${P[0]}.${P[1]}.${P[2]}"
            LAST=$(git tag --list "${BASE}.*" --sort=-v:refname | head -1)
            if [[ -n "$LAST" ]]; then NEXT=$(( ${LAST##*.} + 1 )); else NEXT=0; fi
            TAG="${BASE}.${NEXT}"
            BUILDS=$(jq -c --arg v "$v" --arg t "$TAG" '. + [{version:$v, tag:$t}]' <<< "$BUILDS")
            VERSIONS=$(jq -c --arg v "$v" '. + [$v]' <<< "$VERSIONS")
            echo "Will build ${v} -> ${TAG}"
          done
          ANY=$([[ $(jq 'length' <<< "$VERSIONS") -gt 0 ]] && echo true || echo false)
          {
            echo "builds=${BUILDS}"
            echo "versions=${VERSIONS}"
            echo "any=${ANY}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
    uses: ./.github/workflows/build.yml
    with:
      ffmpeg_version: ${{ matrix.version }}

  # Tests gate the release: a failing test blocks the tag/publish below. Desktop and
  # mobile are separate workflows (mobile's emulator/simulator setup is isolated).
  test:
    needs: [prepare, build]
    if: needs.prepare.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
    uses: ./.github/workflows/test.yml
    with:
      ffmpeg_version: ${{ matrix.version }}

  test-mobile:
    needs: [prepare, build]
    if: needs.prepare.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
    uses: ./.github/workflows/test-mobile.yml
    with:
      ffmpeg_version: ${{ matrix.version }}

  # One tag + GitHub Release per version line.
  release:
    needs: [prepare, build, test, test-mobile]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # create every line's release even if a sibling fails
      matrix:
        build: ${{ fromJson(needs.prepare.outputs.builds) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ matrix.build.version }}"
          TAG="${{ matrix.build.tag }}"
          # Only the HIGHEST tracked version line gets GitHub's "Latest" badge. A
          # maintenance release on an older line (e.g. 8.1.3 published after 9.0 already
          # exists) must NOT become "Latest" — otherwise it steals the badge from the
          # newest major. GitHub's default (--latest omitted) would mis-assign this by
          # recency, so we set it explicitly per release.
          HIGHEST="$(jq -r '.ffmpeg[]' deps.json | sort -V | tail -1)"
          if [[ "${VERSION}" == "${HIGHEST}" ]]; then MARK_LATEST=true; else MARK_LATEST=false; fi
          echo "Highest tracked line: ${HIGHEST} — mark ${VERSION} as latest: ${MARK_LATEST}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"
          gh release create "${TAG}" \
            --title "FFmpeg ${VERSION} (build ${TAG##*.})" \
            --generate-notes \
            --latest="${MARK_LATEST}"

  publish:
    needs: [prepare, build, test, test-mobile, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false   # one cell's failure must NOT cancel the rest — a partial release beats
                         # an empty one, and a real bug then shows in every affected cell, not just
                         # the first to hit it (which is what masked the relink_so bug as 2 failures).
      matrix:
        build: ${{ fromJson(needs.prepare.outputs.builds) }}
        rid: [linux-x64, linux-arm64, linux-armhf, linux-musl-x64, win-x64, osx-x64, osx-arm64, android-arm64]
        license: [lgpl, gpl]
        license_version: [3, 2]   # → license token {license}v{series}: lgplv3/gplv3/lgplv2/gplv2
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.build.version }}-${{ matrix.rid }}-${{ matrix.license }}v${{ matrix.license_version }}
          path: artifacts/${{ matrix.rid }}-${{ matrix.license }}v${{ matrix.license_version }}

      - name: Create release tarballs (runtime + optional dev)
        run: |
          VERSION="${{ matrix.build.version }}"
          VARIANT="${{ matrix.rid }}-${{ matrix.license }}v${{ matrix.license_version }}"
          SRC="artifacts/${VARIANT}"
          RUN="/tmp/run"; DEV="/tmp/dev"
          rm -rf "${RUN}" "${DEV}" && mkdir -p "${RUN}"
          # actions/upload-artifact dereferences symlinks, so the downloaded lib set has the
          # SONAME/linker aliases as full COPIES (3x per .so, 2x per .dylib) — a ~3x-bloated
          # tarball. Collapse each group back to one real file (the fullest-versioned) + relative
          # symlinks, restoring the standard layout the loader expects (ffmpeg's NEEDED is the
          # SONAME). Run inside the target dir.
          relink_so() {    # ELF: libfoo.so, libfoo.so.MAJOR, libfoo.so.MAJOR.MINOR.MICRO
            local link stem f full
            for link in *.so; do
              [ -e "$link" ] || continue
              stem="${link%.so}"; full=""
              for f in "${stem}".so.*; do [ -e "$f" ] || continue; { [ -z "$full" ] || [ "${#f}" -gt "${#full}" ]; } && full="$f"; done
              [ -n "$full" ] || continue
              for f in "$link" "${stem}".so.*; do [ -e "$f" ] && [ "$f" != "$full" ] && ln -sf "$full" "$f"; done
            done
            return 0   # the final loop's last test ([ "$f" != "$full" ]) is falsy → without this
                       # the function returns 1 and `set -e` (bash -e) kills the step silently.
          }
          relink_dylib() { # Mach-O: libfoo.dylib (bare linker alias), libfoo.MAJOR.dylib (real)
            local link stem f full
            for link in *.dylib; do
              [ -e "$link" ] || continue
              case "$link" in *.*.dylib) continue ;; esac   # skip versioned; process only bare libfoo.dylib
              stem="${link%.dylib}"; full=""
              for f in "${stem}".*.dylib; do [ -e "$f" ] || continue; { [ -z "$full" ] || [ "${#f}" -gt "${#full}" ]; } && full="$f"; done
              [ -n "$full" ] && ln -sf "$full" "$link"
            done
            return 0   # last iteration's `[ -n "$full" ] && ln` can be falsy → same set -e trap as relink_so.
          }
          # Runtime tarball = binaries + shared libraries + legal ONLY. Dev files
          # (headers, and Windows import libs) go in a separate -dev tarball so the
          # runtime download stays lean. Android/iOS are link-only artifacts and
          # keep their headers in the main tarball (handled below / in publish-ios).
          case "${VARIANT}" in
            win-*)
              cp "${SRC}"/*.dll "${SRC}"/*.exe "${RUN}/"
              mkdir -p "${DEV}/include" "${DEV}/lib"
              cp -r "${SRC}/include/." "${DEV}/include/"
              cp -r "${SRC}/lib/."     "${DEV}/lib/"   # MSVC .lib import libraries
              ;;
            osx-*)
              cp "${SRC}"/*.dylib "${SRC}/ffmpeg" "${SRC}/ffprobe" "${RUN}/"
              ( cd "${RUN}" && relink_dylib )
              mkdir -p "${DEV}/include"; cp -r "${SRC}/include/." "${DEV}/include/"
              ;;
            android-*)
              # Link-only: headers + libs belong together, no runtime/dev split.
              mkdir -p "${RUN}/include" "${RUN}/lib"
              cp -r "${SRC}/include/." "${RUN}/include/"
              cp -r "${SRC}/lib/."     "${RUN}/lib/"
              ;;
            *)  # linux-*
              cp "${SRC}"/*.so* "${SRC}/ffmpeg" "${SRC}/ffprobe" "${RUN}/"
              ( cd "${RUN}" && relink_so )
              mkdir -p "${DEV}/include"; cp -r "${SRC}/include/." "${DEV}/include/"
              ;;
          esac
          if [ -d "${SRC}/legal" ]; then
            cp -r "${SRC}/legal" "${RUN}/legal"
            [ -d "${DEV}" ] && [ -n "$(ls -A "${DEV}" 2>/dev/null)" ] && cp -r "${SRC}/legal" "${DEV}/legal"
          fi
          tar -czf "ffmpeg-${VERSION}-${VARIANT}.tar.gz" -C "${RUN}" .
          if [ -n "$(ls -A "${DEV}" 2>/dev/null)" ]; then
            tar -czf "ffmpeg-${VERSION}-${VARIANT}-dev.tar.gz" -C "${DEV}" .
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ matrix.build.version }}"
          VARIANT="${{ matrix.rid }}-${{ matrix.license }}v${{ matrix.license_version }}"
          gh release upload "${{ matrix.build.tag }}" \
            "ffmpeg-${VERSION}-${VARIANT}.tar.gz" --clobber --repo "${{ github.repository }}"
          if [ -f "ffmpeg-${VERSION}-${VARIANT}-dev.tar.gz" ]; then
            gh release upload "${{ matrix.build.tag }}" \
              "ffmpeg-${VERSION}-${VARIANT}-dev.tar.gz" --clobber --repo "${{ github.repository }}"
          fi

  publish-ios:
    needs: [prepare, build, test, test-mobile, release]
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false   # don't let one iOS cell's failure cancel the others
      matrix:
        build: ${{ fromJson(needs.prepare.outputs.builds) }}
        license: [lgpl, gpl]
        license_version: [3, 2]   # ios v2 = LGPLv2.1/GPLv2 (App-Store-safe): no version3
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.build.version }}-ios-arm64-${{ matrix.license }}v${{ matrix.license_version }}
          path: artifacts/ios-arm64
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.build.version }}-ios-sim-arm64-${{ matrix.license }}v${{ matrix.license_version }}
          path: artifacts/ios-sim-arm64

      - name: Assemble xcframeworks
        run: |
          VERSION="${{ matrix.build.version }}"
          rm -rf bundle && mkdir -p bundle
          # One .xcframework per libav* library, each bundling the device + simulator .framework.
          # These are dynamic frameworks (iOS is --enable-shared); Xcode embeds + signs them in
          # the consuming app. Dynamic linking is what makes the lgplv2 build LGPLv2.1-compliant
          # (the end user can relink). Headers travel inside each .framework/Headers.
          for fwpath in artifacts/ios-arm64/frameworks/*.framework; do
            name="$(basename "${fwpath}" .framework)"
            xcodebuild -create-xcframework \
              -framework "artifacts/ios-arm64/frameworks/${name}.framework" \
              -framework "artifacts/ios-sim-arm64/frameworks/${name}.framework" \
              -output "bundle/${name}.xcframework"
          done
          # MoltenVK ICD (v3 Vulkan cells): point VK_ICD_FILENAMES at it in the consuming app.
          [ -f artifacts/ios-arm64/frameworks/MoltenVK_icd.json ] \
            && cp artifacts/ios-arm64/frameworks/MoltenVK_icd.json bundle/
          cp -r artifacts/ios-arm64/legal bundle/legal
          tar -czf "ffmpeg-${VERSION}-ios-${{ matrix.license }}v${{ matrix.license_version }}.tar.gz" -C bundle .

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ matrix.build.tag }}" \
            "ffmpeg-${{ matrix.build.version }}-ios-${{ matrix.license }}v${{ matrix.license_version }}.tar.gz" \
            --clobber \
            --repo "${{ github.repository }}"
