name: ShellCheck

# Static analysis of our shell scripts (the bulk of this repo). CodeQL has no shell
# analyzer, so ShellCheck covers scripts/**/*.sh here. Findings are uploaded as SARIF
# so they appear in the Security tab alongside CodeQL. Report-only for now (does not
# fail the build) — flip on a gate once the baseline is triaged (see the commented
# step at the end).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # upload SARIF to the Security tab

concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout has no retry input; its internal helper makes 3 attempts with a RANDOM
      # 10-20s sleep between them, so roughly 20-40s of cover. A DNS or TLS blip longer than that
      # kills the job before any of our code runs:
      #   fatal: unable to access 'https://github.com/...': Could not resolve host: github.com
      # The action cannot be wrapped: a local composite action needs the repo ALREADY checked out,
      # and retry actions only wrap `run:` steps, not `uses:` steps. So wait for the host to be
      # reachable BEFORE checkout, with the same exponential-with-jitter backoff the build scripts
      # use (4, 8, 16, 32, 64s + jitter), and do NOT sleep after the final attempt -- nothing probes
      # again afterwards. Worst case is ~2 minutes of sleep plus the probe timeouts.
      # This never fails the job. If the host is still unreachable it warns and lets checkout run, so
      # the real error is reported by the action rather than masked here.
      - name: Wait for github.com to be reachable
        shell: bash
        run: |
          command -v curl >/dev/null 2>&1 || { echo "curl unavailable - skipping reachability wait"; exit 0; }
          delay=4
          for i in 1 2 3 4 5 6; do
            if curl -sSf -o /dev/null --max-time 10 "${GITHUB_SERVER_URL:-https://github.com}"; then
              if [ "$i" -gt 1 ]; then echo "github.com reachable after attempt ${i}"; fi
              exit 0
            fi
            if [ "$i" -eq 6 ]; then break; fi
            s=$(( delay + (RANDOM % 5) ))
            echo "github.com not reachable (attempt ${i}/6) - retrying in ${s}s" >&2
            sleep "$s"
            delay=$(( delay * 2 ))
          done
          echo "::warning::github.com still unreachable after 6 attempts; letting checkout try anyway"
      - uses: actions/checkout@v7

      - name: Dependency ledger checks
        shell: bash
        run: |
          bash scripts/deps/ledger-test.sh
          bash scripts/deps/ledger-validate-test.sh
          bash scripts/deps/ledger-validate.sh
          bash scripts/ci/select-versions-test.sh
          bash scripts/ci/gen-manifest-test.sh
          bash scripts/ci/pinned-deps-test.sh
          bash scripts/ci/renovate-coverage-test.sh
          bash scripts/ci/matrix-consistency-test.sh
          bash scripts/ci/renovate-config-test.sh

      # Our dep scripts are SOURCED by build.sh and share its environment, so many variables
      # are assigned by the parent, not the script itself; -x follows sourced files so
      # ShellCheck sees those assignments. SC2154 (referenced-but-not-assigned) used to be
      # excluded wholesale for that pattern, but it produces ZERO findings across all 94
      # scripts, so the exclusion bought nothing and hid real bugs: it silently passed
      # `stage_pkgconfig "${prefix}"`, where ${prefix} is a pkg-config variable with no shell
      # counterpart, which aborted staging on every RID under set -u. If a genuine false
      # positive ever appears, disable it INLINE at that reference with a reason, never
      # repo-wide. Severity floor is 'warning'.
      - name: Run ShellCheck (SARIF for the Security tab)
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find scripts -name '*.sh' -type f | sort)
          echo "Linting ${#FILES[@]} scripts..."
          # ShellCheck has no native SARIF formatter; convert its JSON to SARIF inline.
          shellcheck -x -S warning -f json1 "${FILES[@]}" > sc.json || true
          python3 - <<'PY'
          import json
          data = json.load(open('sc.json'))
          rules, results = {}, []
          for c in data.get('comments', []):
              rid = f"SC{c['code']}"
              rules.setdefault(rid, {"id": rid,
                  "helpUri": f"https://www.shellcheck.net/wiki/{rid}",
                  "shortDescription": {"text": c['message']}})
              lvl = {"error": "error", "warning": "warning", "info": "note",
                     "style": "note"}.get(c['level'], "warning")
              results.append({"ruleId": rid, "level": lvl,
                  "message": {"text": c['message']},
                  "locations": [{"physicalLocation": {
                      "artifactLocation": {"uri": c['file']},
                      "region": {"startLine": c['line'], "startColumn": c.get('column', 1)}}}]})
          sarif = {"version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": [{"tool": {"driver": {"name": "ShellCheck",
                  "informationUri": "https://www.shellcheck.net",
                  "rules": list(rules.values())}}, "results": results}]}
          json.dump(sarif, open('shellcheck.sarif', 'w'), indent=2)
          print(f"{len(results)} finding(s)")
          PY

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: shellcheck.sarif
          category: shellcheck


  # Deliberately a SEPARATE job. As a step inside `shellcheck` this reported as
  # "shellcheck failing", which reads like a lint error and repeatedly sent people looking
  # for one — there were never any findings. A blocked merge should say so in its own name.
  matrix-not-narrowed:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout has no retry input; its internal helper makes 3 attempts with a RANDOM
      # 10-20s sleep between them, so roughly 20-40s of cover. A DNS or TLS blip longer than that
      # kills the job before any of our code runs:
      #   fatal: unable to access 'https://github.com/...': Could not resolve host: github.com
      # The action cannot be wrapped: a local composite action needs the repo ALREADY checked out,
      # and retry actions only wrap `run:` steps, not `uses:` steps. So wait for the host to be
      # reachable BEFORE checkout, with the same exponential-with-jitter backoff the build scripts
      # use (4, 8, 16, 32, 64s + jitter), and do NOT sleep after the final attempt -- nothing probes
      # again afterwards. Worst case is ~2 minutes of sleep plus the probe timeouts.
      # This never fails the job. If the host is still unreachable it warns and lets checkout run, so
      # the real error is reported by the action rather than masked here.
      - name: Wait for github.com to be reachable
        shell: bash
        run: |
          command -v curl >/dev/null 2>&1 || { echo "curl unavailable - skipping reachability wait"; exit 0; }
          delay=4
          for i in 1 2 3 4 5 6; do
            if curl -sSf -o /dev/null --max-time 10 "${GITHUB_SERVER_URL:-https://github.com}"; then
              if [ "$i" -gt 1 ]; then echo "github.com reachable after attempt ${i}"; fi
              exit 0
            fi
            if [ "$i" -eq 6 ]; then break; fi
            s=$(( delay + (RANDOM % 5) ))
            echo "github.com not reachable (attempt ${i}/6) - retrying in ${s}s" >&2
            sleep "$s"
            delay=$(( delay * 2 ))
          done
          echo "::warning::github.com still unreachable after 6 attempts; letting checkout try anyway"
      - uses: actions/checkout@v7
      - name: Fail if a build matrix is still temporarily narrowed
        run: |
          # The marker is assembled at runtime so THIS workflow's own source does not contain the
          # literal string. Grepping for it directly made the guard match itself, so it could never
          # pass -- not even with the matrix fully restored. Excluding this file instead would have
          # left a blind spot; this keeps every workflow in scope, including this one.
          marker="TEMP-""NARROWED"
          if grep -rn "${marker}" .github/workflows/; then
            echo "::error::A build matrix is still temporarily narrowed — restore the full RID list before merging."
            exit 1
          fi
          echo "ok: no temporarily narrowed matrices"