name: CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build/test only the versions this PR actually affects, so a PR doesn't rebuild
  # every tracked FFmpeg version. Same diff logic as release.yml's prepare, so CI and
  # release agree on what a change touches:
  #   - a build-recipe change (scripts/, except tests) → ALL tracked versions
  #   - only deps.json's .ffmpeg list → just the added/changed lines (an add-9 PR → only 9)
  #   - anything else (docs, etc.) → nothing
  resolve:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.v.outputs.versions }}
      any: ${{ steps.v.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base commit to diff the PR against
      - id: v
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mapfile -t TRACKED < <(jq -r '.ffmpeg[]' deps.json)
          echo "Changed vs base:"; git diff --name-only "${BASE_SHA}" HEAD || true
          # Which lines this PR affects (shared with release.yml via select-versions.sh):
          #   build-recipe change (scripts/**, non-test) -> all lines
          #   deps.json bump -> only lines whose RESOLVED deps changed (a line that whole-line-
          #                     pins the bumped dep is skipped — it wasn't affected)
          #   deps.json's .ffmpeg list   -> the added/changed version lines
          mapfile -t SEL < <(bash scripts/ci/select-versions.sh "${BASE_SHA}" "${TRACKED[@]}")
          echo "Selected versions: ${SEL[*]:-none}"

          VERSIONS='[]'
          for v in "${SEL[@]:-}"; do
            [[ -z "$v" ]] && continue
            VERSIONS=$(jq -c --arg v "$v" '. + [$v]' <<< "$VERSIONS")
          done
          ANY=$([[ "$(jq 'length' <<< "$VERSIONS")" -gt 0 ]] && echo true || echo false)
          {
            echo "versions=${VERSIONS}"
            echo "any=${ANY}"
          } >> "$GITHUB_OUTPUT"
          echo "Building: ${VERSIONS}"

  # Keep the committed build-coverage matrices (docs/matrix/) in lockstep with what we
  # actually build. They are generated from FFmpeg's configure + the build scripts + the
  # dependency ledger (deps.json), so a DEP BUMP, a deps.json's .ffmpeg list change, or a build-script
  # edit must regenerate them — not just an FFmpeg change. This job regenerates and fails if
  # the committed files drifted; the fix is `bash scripts/gen-matrix.sh` + commit. Cheap
  # (~1 min), so it runs on every PR. SELECT THIS as a required check alongside build/test.
  docs-matrix:
    runs-on: ubuntu-latest   # ANDROID_NDK_LATEST_HOME is preinstalled here (the android sim needs it)
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate coverage matrices and fail on drift
        run: |
          set -euo pipefail
          bash scripts/gen-matrix.sh
          if ! git diff --quiet -- docs/matrix; then
            echo "::error::docs/matrix is stale — run 'bash scripts/gen-matrix.sh' and commit the result (a dependency bump in deps.json changes these files too)."
            git diff --stat -- docs/matrix
            git --no-pager diff -- docs/matrix | head -300
            exit 1
          fi
          echo "Coverage matrices are up to date."

  # The matrix-caller jobs (one reusable-workflow call, fanned out per version × RID ×
  # license). Their individual matrix checks surface as "build-matrix / …", "test-matrix / …"
  # — you do NOT select those in branch protection; select the aggregate `build`/`test` gates
  # below, which reflect the whole matrix in one check each.
  build-matrix:
    needs: resolve
    if: needs.resolve.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.resolve.outputs.versions) }}
    uses: ./.github/workflows/build.yml
    with:
      ffmpeg_version: ${{ matrix.version }}
      fail_fast: false

  # Tests run separately, after the build, against its uploaded artifacts. Desktop and
  # mobile are split so mobile's slow emulator/simulator setup doesn't gate or
  # destabilise the fast desktop execution checks.
  test-matrix:
    needs: [resolve, build-matrix]
    if: needs.resolve.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.resolve.outputs.versions) }}
    uses: ./.github/workflows/test.yml
    with:
      ffmpeg_version: ${{ matrix.version }}
      fail_fast: false

  test-mobile-matrix:
    needs: [resolve, build-matrix]
    if: needs.resolve.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.resolve.outputs.versions) }}
    uses: ./.github/workflows/test-mobile.yml
    with:
      ffmpeg_version: ${{ matrix.version }}
      fail_fast: false

  # ── Aggregate required status checks ──────────────────────────────────────
  # SELECT THESE TWO ("build" and "test") as the required checks in the branch ruleset —
  # NOT the ~100 individual matrix jobs. Each reflects its whole matrix: green when every
  # matrix job passed OR was skipped (a docs-only PR builds/tests nothing), red on any real
  # failure/cancellation. `test` covers both desktop AND mobile. Select BOTH: `test` is
  # green-when-skipped, so if a build fails, `build` (also required) is what blocks the merge.
  build:
    if: always()
    needs: [resolve, build-matrix]
    runs-on: ubuntu-latest
    steps:
      - run: |
          r="${{ needs.build-matrix.result }}"
          if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
            echo "build failed (matrix result: $r)"; exit 1
          fi
          echo "build passed (matrix result: $r)"

  test:
    if: always()
    needs: [resolve, test-matrix, test-mobile-matrix]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.test-matrix.result }}" "${{ needs.test-mobile-matrix.result }}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "test failed (a desktop/mobile test matrix did not pass: $r)"; exit 1
            fi
          done
          echo "test passed (desktop + mobile)"
