name: Renovate

# Self-hosted Renovate: runs the Renovate CLI as a scheduled Action in this repo (no
# external service), same trust model as check-updates.yml. It reads renovate.json, which
# scopes a custom regex manager to the DEFAULTS block of deps.json and opens a PR when an
# upstream publishes a newer tag. CI (build + docs-matrix) then validates that bump across
# every FFmpeg line before it can merge; if a line can't take the new version, add an
# overrides.<major>[.platforms] hold in the same PR (Renovate never edits overrides).

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Run without opening PRs (log only)"
        type: boolean
        default: false

permissions:
  contents: write         # create branches
  pull-requests: write    # open/update bump PRs

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Renovate
        uses: renovatebot/github-action@v41
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configurationFile: renovate.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || null }}
          LOG_LEVEL: info
